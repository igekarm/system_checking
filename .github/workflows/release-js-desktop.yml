name: Release DB Tools desktop
on:
  push:
    tags: ["app-v*"]
permissions:
  contents: write
defaults:
  run:
    working-directory: JS_project
jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: JS_project/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Set release version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^app-v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release tag: $env:GITHUB_REF_NAME" }
          npm pkg set "version=$version" -w desktop
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Embed public update configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_SIGNING_PRIVATE_KEY_BASE64)) { throw "Repository secret UPDATE_SIGNING_PRIVATE_KEY_BASE64 is missing" }
          node scripts/configure-update-build.js
        env:
          DB_TOOLS_WINDOWS_PUBLISHER_SUBJECT: ${{ vars.DB_TOOLS_WINDOWS_PUBLISHER_SUBJECT }}
          UPDATE_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_BASE64 }}
      - run: npm run build -w app
      - run: npm run package:win -w desktop
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - name: Create signed update manifest
        shell: pwsh
        env:
          UPDATE_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_BASE64 }}
        run: |
          $installer = Get-ChildItem "release/DB-Tools-$env:RELEASE_VERSION-win-x64.exe" | Select-Object -ExpandProperty FullName
          node scripts/create-update-manifest.js $installer $env:RELEASE_VERSION $env:GITHUB_SHA stable
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME "release/DB-Tools-$env:RELEASE_VERSION-win-x64.exe" "release/DB-Tools-$env:RELEASE_VERSION-win-x64.exe.blockmap" "release/latest-win-x64-stable.json" --verify-tag --generate-notes --title "DB Tools $env:RELEASE_VERSION"
